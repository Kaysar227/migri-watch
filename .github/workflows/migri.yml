name: Migri randevu takibi

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: migri-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - uses: actions/cache/restore@v4
        with:
          path: seen_slots.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Randevulari kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERVICE_ID: ${{ vars.SERVICE_ID }}
          CITIES: ${{ vars.CITIES || 'Helsinki,Turku' }}
          BEFORE_DATE: ${{ vars.BEFORE_DATE || '2027-01-08' }}
          WEEKS_AHEAD: ${{ vars.WEEKS_AHEAD || '12' }}
        run: python migri_watch.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('seen_slots.json') != ''
        with:
          path: seen_slots.json
          key: seen-${{ github.run_id }}
